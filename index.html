<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Market Reader – Probabilidades Reais</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <h1>📊 Market Reader</h1>
            <p>Probabilidades Reais do Mercado (Sem Margem)</p>
        </header>

        <!-- ================= RESULTADO 1X2 ================= -->
        <section class="card">
            <h2>Resultado Final (1X2)</h2>
            <div class="grid-3">
                <input type="number" step="0.01" id="oddCasa" placeholder="Odd Casa">
                <input type="number" step="0.01" id="oddEmpate" placeholder="Odd Empate">
                <input type="number" step="0.01" id="oddVisitante" placeholder="Odd Visitante">
            </div>
        </section>

        <!-- ================= GOLS 2.5 ================= -->
        <section class="card">
            <h2>Gols (Linha 2.5)</h2>
            <div class="grid-2">
                <input type="number" step="0.01" id="oddOver25" placeholder="Odd Over 2.5">
                <input type="number" step="0.01" id="oddUnder25" placeholder="Odd Under 2.5">
            </div>
        </section>

        <!-- ================= BTTS ================= -->
        <section class="card">
            <h2>Ambos Marcam (BTTS)</h2>
            <div class="grid-2">
                <input type="number" step="0.01" id="oddBttsSim" placeholder="Odd BTTS Sim">
                <input type="number" step="0.01" id="oddBttsNao" placeholder="Odd BTTS Não">
            </div>
        </section>

        <!-- ================= AÇÃO ================= -->
        <div class="actions">
            <button id="btnAnalisar">Calcular Probabilidades</button>
        </div>

        <!-- ================= RESULTADO ================= -->
        <section class="result card">
            <h2>Probabilidades Reais do Mercado</h2>
            <pre id="diagnostico">
Preencha as odds e clique em calcular.
            </pre>
        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
